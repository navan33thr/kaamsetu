<div class="w" style="padding-top:20px"><div class="gd">${[['12,480','Workers'],['3,150','Employers'],['8,900','Jobs posted'],['2,310','Placements']].map(s=>`<div class="c"><div class="sn">${s[0]}</div>${s[1]}</div>`).join('')}</div><div class="mu">Demo figures for illustration, not real usage.</div>
<h2>How it works</h2><div class="gd">${[['📝','Create a profile','Pick your skills, area and daily pay.'],['🎤','Speak or type','Say what work you need near you.'],['🎯','See your matches','Every job shows a match score and the reasons.'],['✅','Apply and get a reply','Employers accept or reject, and you get an alert.']].map(s=>`<div class="c"><span class="ic">${s[0]}</span><h3>${s[1]}</h3><div class="mu">${s[2]}</div></div>`).join('')}</div>
<h2>Popular categories</h2><div class="gd">${CAT.map(c=>`<div class="c rw" style="cursor:pointer" onclick="start('worker')"><span class="ic">${ICO[c]}</span><b>${c}</b></div>`).join('')}</div>
<div class="gd"><div class="c"><h3>For workers</h3><div class="mu">Work close to home. Voice search in your language. Exact address never shown. Clear reasons behind every match.</div></div><div class="c"><h3>For employers</h3><div class="mu">Post a job in under a minute. See nearby workers’ skills and ratings. Accept or reject in one tap.</div></div></div></div>
<div class="ft"><div class="w">KAAMSETU · Bengaluru · hello@kaamsetu.example (demo)<br>Track 4 UnlockED · Hyper-Local Job Matching for Informal and Semi-Skilled Workers</div></div>`,
auth=()=>{const w=S.reg=='worker';return`<div class="w" style="max-width:640px;padding-top:22px"><div class="c"><h2>Join KAAMSETU</h2><div class="rw"><button class="b ${w?'bt':''}" onclick="S.reg='worker';rr()">👷 I’m a worker</button><button class="b ${w?'':'bt'}" onclick="S.reg='employer';rr()">🏢 I’m an employer</button></div>
<div class="f"><label>${w?'Name':'Name or business name'}<input id="fn"></label><label>Mobile number<input id="fp" inputmode="numeric" maxlength="10"></label>${w?`<label>Preferred language${sel('fg',['Kannada','Hindi','Tamil','English'])}</label><label>Location${sel('fl',LN)}</label><label>Experience (years)<input id="fx" type="number" min="0"></label><label>Expected pay (₹/day)<input id="fs" type="number" min="0"></label><label>Availability${sel('fa',['Today','This week','Weekends'])}</label><div class="x"><label>Skills</label><div class="rw wr">${CAT.map(c=>`<label class="ch" style="cursor:pointer"><input type="checkbox" class="sk" value="${c}" style="width:auto"> ${c}</label>`).join('')}</div></div>`:`<label>Business type${sel('fb',['Contractor','Household','Shop','Company'])}</label><label>Location${sel('fl',LN)}</label>`}</div><button class="b bo" onclick="reg()">Create account</button>
<hr><b>Quick demo login</b><div class="mu">Demo authentication only: no OTP or password is checked. Production would use Supabase or Firebase phone-OTP auth.</div><div class="rw wr"><button class="b bt" onclick="login(U.worker)">Demo worker (Ravi, electrician)</button><button class="b bn" onclick="login(U.employer)">Demo employer (Meera)</button><button class="b" onclick="login(U.admin)">Demo admin</button></div></div></div>`},
worker=()=>{const u=S.user,n=S.notes.filter(x=>x.to==u.id),T=[['jobs','🔍 Jobs'],['urgent','🔥 Urgent'],['map','🗺 Map'],['saved','♥ Saved'],['apps','📄 Applications'],['notes',`🔔 Alerts (${n.length})`],['me','👤 Profile']];
return`<div class="w"><div class="c" style="margin-top:14px"><div class="rw wr"><div class="sp"><h2>Namaskara, ${u.name.split(' ')[0]} 👋</h2><div class="mu">📍 ${S.loc.n} · Status: <b>${u.av=='Today'?'🟢 Available today':'🟡 '+u.av}</b></div></div>${sel('lc',LN,S.loc.n).replace('<select','<select style="width:auto" onchange="setLoc(this.value)"')}<button class="b" onclick="locate()">📡 Use my location</button></div><div class="mu">Location stays in your browser. Employers only see an approximate distance.</div></div>
<div class="tb">${T.map(t=>`<button class="b ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';rr()">${t[1]}</button>`).join('')}</div>${P[S.tab]()}</div>`},
H={'en-IN':'I need electrician work near me','hi-IN':'मुझे बिजली का काम चाहिए','kn-IN':'ನನಗೆ ಎಲೆಕ್ಟ್ರಿಷಿಯನ್ ಕೆಲಸ ಬೇಕು','ta-IN':'எனக்கு மின் வேலை வேண்டும்'},
P={jobs:()=>{const r=jobs();return`<div class="c"><div class="rw"><button class="mc ${S.listen?'ls':''}" onclick="mic()" aria-label="Voice search">🎤</button><div class="sp"><b>${S.listen?'Listening… speak now':'Tap the mic and speak, or type'}</b><div class="mu" id="hd">${S.heard?'“'+S.heard+'”':'Try: “'+H[S.lang]+'”'}</div></div><select style="width:auto" onchange="S.lang=this.value;rr()">${[['en-IN','English'],['kn-IN','ಕನ್ನಡ'],['hi-IN','हिन्दी'],['ta-IN','தமிழ்']].map(l=>`<option value="${l[0]}" ${S.lang==l[0]?'selected':''}>${l[1]}</option>`).join('')}</select></div>
<div class="rw" style="margin-top:10px"><input id="vq" placeholder="Type: plumbing jobs within 5 km, or jobs paying above 800" onkeydown="event.key=='Enter'&&run(this.value)"><button class="b bn" onclick="run($('#vq').value)">Search</button></div>${S.und.length?`<div class="mu" style="margin-top:8px">Understood: ${S.und.map(x=>`<span class="ch">${x}</span>`).join(' ')}</div>`:''}<div class="mu">Voice needs browser support and microphone permission.</div></div>
<div class="c rw wr">${[2,5,10].map(k=>`<button class="b ${S.rad==k?'bt':''}" onclick="S.rad=${k};rr()">${k} km</button>`).join('')}<select style="width:auto" onchange="S.cat=this.value;rr()">${['All',...CAT].map(c=>`<option ${S.cat==c?'selected':''}>${c}</option>`).join('')}</select><select style="width:auto" onchange="S.type=this.value;rr()">${['All','Daily wage','Part-time','Full-time'].map(c=>`<option ${S.type==c?'selected':''}>${c}</option>`).join('')}</select><select style="width:auto" onchange="S.min=+this.value;rr()">${[0,700,900,1200].map(c=>`<option value="${c}" ${S.min==c?'selected':''}>${c?'₹'+c+'+/day':'Any pay'}</option>`).join('')}</select><label><input type="checkbox" style="width:auto" ${S.urg?'checked':''} onchange="S.urg=+this.checked;rr()"> Urgent</label><label><input type="checkbox" style="width:auto" ${S.today?'checked':''} onchange="S.today=+this.checked;rr()"> Today</label><button class="b" onclick="Object.assign(S,{cat:'All',type:'All',min:0,urg:0,today:0,rad:10,und:[],heard:''});rr()">Reset</button></div>
<h3>${r.length} jobs within ${S.rad} km · best match first</h3><div class="mu">Match % comes from a rule-based scoring engine: skills 40, distance 25, availability 10, pay 10, experience 10, urgency 5. It is not a live AI service. Gemini needs an API key and a server-side proxy.</div>${list(r)}`},
urgent:()=>`<h3>🔥 Urgent Jobs Near You</h3><div class="mu">Same-day work and urgent hiring within ${S.rad} km.</div><div class="c rw wr">${[2,5,10].map(k=>`<button class="b ${S.rad==k?'bt':''}" onclick="S.rad=${k};rr()">${k} km</button>`).join('')}</div>${list(jobs(j=>(j.urgent||j.today)&&dist(j)<=S.rad))}`,
map:()=>{const r=jobs(),k=13;return`<div class="c"><b>Nearby jobs map</b><div class="mu">Tap a pin for details. Positions are approximate. Google Maps tiles need an API key, so this prototype draws a radius map.</div><svg viewBox="0 0 320 320" width="420" style="display:block;margin:auto">${[10,5,2].map(d=>`<circle cx="160" cy="160" r="${d*k}" fill="var(--soft)" stroke="var(--teal)" stroke-dasharray="3 3"/><text x="160" y="${160-d*k+11}" font-size="9" text-anchor="middle" fill="var(--mut)">${d} km</text>`).join('')}<circle cx="160" cy="160" r="8" fill="var(--navy)"/><text x="160" y="178" font-size="9" text-anchor="middle" fill="var(--ink)">You</text>${r.map(j=>{const dx=(j.lng-S.loc.lng)*111*Math.cos(S.loc.lat*Math.PI/180),dy=(S.loc.lat-j.lat)*111;return`<circle cx="${160+dx*k}" cy="${160+dy*k}" r="9" fill="${j.urgent?'var(--or)':'var(--teal)'}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="oj(${j.id})"><title>${j.title} · ${j.d} km</title></circle>`}).join('')}</svg><div class="mu">🟠 urgent · 🟢 regular</div></div>`},
saved:()=>list(jobs(j=>S.saved.includes(j.id))),
apps:()=>{const a=S.apps.filter(x=>x.w.id==S.user.id);return a.length?a.map(x=>{const j=S.jobs.find(y=>y.id==x.job);return`<div class="c rw"><span class="ic">${ICO[j.cat]}</span><div class="sp"><b>${j.title}</b><div class="mu">${j.emp}</div></div><span class="ch ${x.st=='Accepted'?'':x.st=='Rejected'?'or':'gy'}">${x.st}</span></div>`}).join(''):'<div class="c mu">No applications yet. Apply from the Jobs tab.</div>'},
notes:()=>{const n=S.notes.filter(x=>x.to==S.user.id);return`<div class="mu">In-app alerts only. WhatsApp Cloud API hook: not configured, so no WhatsApp messages are sent.</div>${n.map(x=>`<div class="c">🔔 ${x.t}<div class="mu">${x.m}</div></div>`).join('')||'<div class="c mu">No alerts yet.</div>'}`},
me:()=>{const u=S.user,f=[u.name,u.phone,u.skills.length,u.loc,u.sal,u.av,u.lang,u.exp>=0],pc=Math.round((f.filter(Boolean).length)/10*100);return`<div class="c"><div class="rw"><span class="ic">👷</span><div class="sp"><h3>${u.name}</h3><div class="mu">${u.exp} yrs · ₹${u.sal}/day · ${u.lang||'—'}</div></div><span class="ch ${u.demo?'gy':''}">${u.demo?'Demo user':'Self-registered'}</span></div><div style="margin:12px 0"><b>Profile ${pc}% complete</b><div style="background:var(--line);border-radius:6px"><div style="width:${pc}%;height:10px;background:var(--teal);border-radius:6px"></div></div><div class="mu">Portfolio photos and ID verification would complete the last 20%. They need storage and KYC, not built here.</div></div>
<label class="mu">Availability</label><select onchange="S.user.av=this.value;rr()">${['Today','This week','Weekends'].map(a=>`<option ${u.av==a?'selected':''}>${a}</option>`).join('')}</select><p><b>Skills</b> (tap to change)</p><div class="rw wr">${CAT.map(c=>`<button class="b ${u.skills.includes(c)?'bt':''}" onclick="tg('${c}')">${c}</button>`).join('')}</div></div>
<div class="c"><b>Trust profile</b><p>Rating: ⭐ ${u.rating||'No reviews yet'}${u.demo?' (demo reviews)':''}</p><p class="mu"><b>Self-reported:</b> skills, experience, pay. <b>Verified:</b> nothing yet. Mobile OTP and ID checks are off in this prototype, so no profile is labelled verified.</p></div>`}},
employer=()=>{const u=S.user,mj=S.jobs.filter(j=>j.owner==u.id),ma=S.apps.filter(a=>mj.some(j=>j.id==a.job)),T=[['stats','📊 Overview'],['post','➕ Post job'],['list','📋 My listings'],['apps',`👥 Applicants (${ma.filter(a=>a.st=='Pending').length})`]],n=S.notes.filter(x=>x.to==u.id),c=s=>ma.filter(a=>a.st==s).length;
const B={stats:()=>`<div class="gd">${[['Active listings',mj.length],['Applications',ma.length],['Shortlisted',c('Accepted')],['Rejected',c('Rejected')]].map(s=>`<div class="c"><div class="sn">${s[1]}</div>${s[0]}</div>`).join('')}</div><h3>Recent activity</h3>${n.map(x=>`<div class="c">🔔 ${x.t}</div>`).join('')||'<div class="c mu">Nothing yet.</div>'}`,
post:()=>`<div class="c"><h3>Post a job</h3><div class="f"><label class="x">Job title<input id="pt"></label><label>Category${sel('pc',CAT)}</label><label>Pay (₹/day)<input id="ps" type="number"></label><label class="x">Description<textarea id="pd" rows="2"></textarea></label><label class="x">Required skills (comma separated)<input id="pk"></label><label>Location${sel('pl',LN,u.loc)}</label><label>Work duration${sel('pr',['1 day','1 week','1 month','Ongoing'])}</label><label>Working hours<input id="ph" value="9am–5pm"></label><label>Workers needed<input id="pn" type="number" value="1" min="1"></label><label class="x"><input type="checkbox" id="pu" style="width:auto"> 🔥 Urgent hiring (needed today)</label></div><button class="b bo" onclick="pj()">Post job</button></div>`,
list:()=>mj.map(j=>`<div class="c rw"><span class="ic">${ICO[j.cat]}</span><div class="sp"><b>${j.title}</b><div class="mu">${j.loc} · ₹${j.sal}/day · ${S.apps.filter(a=>a.job==j.id).length} applicants ${j.urgent?'· 🔥 urgent':''}</div></div><button class="b" onclick="cl(${j.id})">Close</button></div>`).join('')||'<div class="c mu">No listings yet. Post your first job.</div>',
apps:()=>ma.map(a=>{const j=S.jobs.find(y=>y.id==a.job);return`<div class="c"><div class="rw wr"><div class="sp"><b>${a.w.name}</b> <span class="mu">for ${j.title}</span><div class="mu">${a.w.skills.join(', ')} · ${a.w.exp} yrs · ₹${a.w.sal}/day</div></div><span class="ch ${a.st=='Accepted'?'':a.st=='Rejected'?'or':'gy'}">${a.st}</span></div><div class="rw wr"><button class="b" onclick="wp(${a.id})">View profile</button><button class="b bt" onclick="dc(${a.id},'Accepted')">Accept</button><button class="b" onclick="dc(${a.id},'Rejected')">Reject</button></div></div>`}).join('')||'<div class="c mu">No applications yet.</div>'};
return`<div class="w"><h2 style="margin-top:16px">${u.name}</h2><div class="tb">${T.map(t=>`<button class="b ${S.et==t[0]?'on':''}" onclick="S.et='${t[0]}';rr()">${t[1]}</button>`).join('')}</div>${B[S.et]()}</div>`},
bars=(o,c)=>{const m=Math.max(...Object.values(o),1);return Object.entries(o).map(([k,v])=>`<div class="rw" style="margin:5px 0"><span class="mu" style="width:104px">${k}</span><div class="sp" style="background:var(--line);border-radius:6px"><div style="width:${v/m*100}%;background:${c};height:14px;border-radius:6px"></div></div><b>${v}</b></div>`).join('')},
admin=()=>{const cc={},sc={Pending:0,Accepted:0,Rejected:0};S.jobs.forEach(j=>cc[j.cat]=(cc[j.cat]||0)+1);S.apps.forEach(a=>sc[a.st]++);
return`<div class="w"><h2 style="margin-top:16px">Admin dashboard <span class="ch or">Demo data</span></h2><div class="gd">${[['Workers',12480+S.W.length-1],['Employers',3150],['Total jobs',8900+S.jobs.filter(j=>!j.demo).length],['Active listings',S.jobs.length],['Applications',S.apps.length],['Placements',2310+sc.Accepted],['Reported',S.reports.length]].map(s=>`<div class="c"><div class="sn">${s[1]}</div>${s[0]}</div>`).join('')}</div>
<div class="gd"><div class="c"><b>Listings by category</b>${bars(cc,'var(--teal)')}</div><div class="c"><b>Applications by status</b>${bars(sc,'var(--or)')}</div><div class="c"><b>Hiring activity this week</b>${bars({Mon:42,Tue:55,Wed:61,Thu:48,Fri:70,Sat:83,Sun:30},'var(--navy)')}</div></div>
<div class="c"><b>Reported listings</b>${S.reports.map(r=>`<div style="margin:8px 0">🚩 ${r.t}<div class="mu">${r.r}</div></div>`).join('')}</div></div>`};
rr();
</script></body></html>
